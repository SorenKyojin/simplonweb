<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercice grille Bootstrap - Simplon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            background: #f2f3f5;
        }

        body {
            min-width: 320px;
            margin: 0;
            background: #f2f3f5;
            color: #343a40;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            background: #fff;
        }

        .layout-block {
            display: flex;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            border: 1px solid;
            border-radius: 5px;
            text-align: center;
        }

        .page-header {
            min-height: 52px;
            border-color: #212529;
            background: #212529;
            color: #fff;
        }

        .service {
            border-color: #0d6efd;
            background: #fff;
        }

        .article {
            min-height: 88px;
            border-color: #198754;
        }

        .sidebar {
            min-height: 88px;
            border-color: #fd9f00;
        }

        .photo {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .page-footer {
            min-height: 40px;
            border-color: #6c757d;
            background: #6c757d;
            color: #fff;
        }

        @media (min-width: 768px) {
            .page {
                padding: 16px 30px 30px;
            }
        }
    </style>
</head>
<body>
    <main class="page container-fluid">
        <header class="row mb-3">
            <div class="col">
                <div class="layout-block page-header">En-tête</div>
            </div>
        </header>

        <section class="row g-3 mb-3" aria-label="Services">
            <div class="col-12 col-lg-4">
                <div class="layout-block service">Service 1</div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="layout-block service">Service 2</div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="layout-block service">Service 3</div>
            </div>
        </section>

        <section class="row g-3 mb-3">
            <article class="col-12 col-lg-8">
                <div class="layout-block article">Article</div>
            </article>
            <aside class="col-12 col-lg-4" aria-label="Barre latérale">
                <div class="layout-block sidebar">Barre latérale</div>
            </aside>
        </section>

        <section class="row g-3 mb-3" aria-label="Photos">
            <div class="col-6 col-lg-3">
                <div class="layout-block photo">Photo 1</div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="layout-block photo">Photo 2</div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="layout-block photo">Photo 3</div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="layout-block photo">Photo 4</div>
            </div>
        </section>

        <footer class="row">
            <div class="col">
                <div class="layout-block page-footer">Pied de page</div>
            </div>
        </footer>
    </main>
</body>
</html>
