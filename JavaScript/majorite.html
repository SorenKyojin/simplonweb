</head>
<body>
    <h1>Javascript</h1>
    <script>
        let age = parseInt(prompt("Indiquez votre âge"));
        if (age < 18) {
            numberState = "Mineur";
        } else if (age >= 900) {
            numberState = "un seingeur du temps";
        } else {
            numberState = "Majeur";
        }
        alert("Vous êtes " + numberState);
    </script>
