<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <h1>Javascript</h1>
    <script>
        let number = parseInt(prompt("Entrez un nombre entier"));
        lastDigit = number % 10;
        switch (lastDigit) {
            case 1:
                numberState = "Impair"
                break;
        
            case 2:
                numberState = "Pair"
                break;
        
            case 3:
                numberState = "Impair"
                break;
            case 4:
                numberState = "Pair"
                break;
        
            case 5:
                numberState = "Impair"
                break;

            case 6:
                numberState = "Pair"
                break;
        
            case 7:
                numberState = "Impair"
                break;
            case 8:
                numberState = "Pair"
                break;
        
            case 9:
                numberState = "Impair"
                break;

            case 0:
                numberState = "Pair"
                break;
        
            default:
                numberState = "Inconnu"
                break;
        }
        alert("Le nombre est " + numberState);
        window.location.replace("../exercices_js.html");
    </script>
</body>
</html>
