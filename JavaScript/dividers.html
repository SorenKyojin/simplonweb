<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>Nombre de diviseurs</title>
</head>

<body>
    <div class="box center">
        <h1 class="title oswald">Nombre de diviseurs</h1>
        <p class="nunito">
            La fonction nbDiviseurs(n) reçoit un entier positif et renvoie son nombre de diviseurs.<br>
            Exemple:<br>
            nbDiviseurs(5) -> 2 (1 et 5)<br>
            nbDiviseurs(12) -> 6 (1, 2, 3, 4, 6 et 12)
        </p>
        <a href="../exercices_js.html" class="blue-button">Retour</a>
    </div>
    <div class="box center">
        <h2 class="oswald">Entrer le nombre</h2>
        <input type="number" name="number" id="number">
        <button id="find" class="green-button">Afficher les diviseurs</button>
    </div>
    <div class="box center">
        <p class="nunito" id="dividers-list"></p>
    </div>
    <script>
        let dividers = "";
        function nbDiviseurs(n) {
            dividers = "";
            for (let i = 1; i <= n; i++) {
                if (n % i === 0) {
                    dividers += (dividers ? ", " : "") + i;
                }
            }
        }

        document.getElementById("find").addEventListener("click", function () {
            nbDiviseurs(Number(document.getElementById("number").value));
            document.getElementById("dividers-list").textContent = dividers;
        });
    </script>
</body>

</html>
